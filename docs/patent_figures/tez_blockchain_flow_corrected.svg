<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #f5f7fb; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #9fb0c5; font: 400 16px Arial, sans-serif; }
      .section { font: 700 24px Arial, sans-serif; }
      .box { fill: #161b22; stroke-width: 3; rx: 18; ry: 18; }
      .boxtext { fill: #f5f7fb; font: 700 20px Arial, sans-serif; text-anchor: middle; }
      .subtext { fill: #9fb0c5; font: 400 14px Arial, sans-serif; text-anchor: middle; }
      .step { fill: #12161d; stroke: #ffd84d; stroke-width: 2; }
      .steptext { fill: #0d1117; font: 700 16px Arial, sans-serif; text-anchor: middle; }
      .note { fill: #9fb0c5; font: 400 15px Arial, sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowFlow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffd84d"/>
    </marker>
    <marker id="arrowVerify" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#31d0aa"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="940"/>

  <text x="800" y="52" class="title" text-anchor="middle">Blockchain / Ledger Verification Flow</text>
  <text x="800" y="82" class="subtitle" text-anchor="middle">How Tez binds article hashing, credibility metadata, and later verification</text>

  <text x="800" y="132" class="section" fill="#ffd84d" text-anchor="middle">STORE FLOW (Admin uploads article)</text>

  <circle cx="125" cy="176" r="24" class="step"/><text x="125" y="182" class="steptext">1</text>
  <rect x="55" y="200" width="200" height="104" class="box" stroke="#7c6dff"/>
  <text x="155" y="255" class="boxtext">Admin Uploads</text>
  <text x="155" y="283" class="boxtext">Article</text>

  <circle cx="385" cy="176" r="24" class="step"/><text x="385" y="182" class="steptext">2</text>
  <rect x="285" y="200" width="200" height="104" class="box" stroke="#54a8ff"/>
  <text x="385" y="255" class="boxtext">Backend API</text>
  <text x="385" y="283" class="boxtext">Receives Article</text>

  <circle cx="645" cy="176" r="24" class="step"/><text x="645" y="182" class="steptext">3</text>
  <rect x="545" y="200" width="200" height="104" class="box" stroke="#9e7bff"/>
  <text x="645" y="248" class="boxtext">Prediction and</text>
  <text x="645" y="276" class="boxtext">Credibility Score</text>
  <text x="645" y="296" class="subtext">Generated by analysis service</text>

  <circle cx="905" cy="176" r="24" class="step"/><text x="905" y="182" class="steptext">4</text>
  <rect x="805" y="200" width="200" height="104" class="box" stroke="#31d0aa"/>
  <text x="905" y="248" class="boxtext">SHA-256 Story</text>
  <text x="905" y="276" class="boxtext">Hash Generated</text>
  <text x="905" y="296" class="subtext">Deterministic content fingerprint</text>

  <circle cx="1165" cy="176" r="24" class="step"/><text x="1165" y="182" class="steptext">5</text>
  <rect x="1065" y="200" width="200" height="104" class="box" stroke="#ffd84d"/>
  <text x="1165" y="248" class="boxtext">Ledger / Contract</text>
  <text x="1165" y="276" class="boxtext">Record Stored</text>
  <text x="1165" y="296" class="subtext">Hash linked with verification metadata</text>

  <circle cx="1425" cy="176" r="24" class="step"/><text x="1425" y="182" class="steptext">6</text>
  <rect x="1325" y="200" width="200" height="104" class="box" stroke="#ff9b45"/>
  <text x="1425" y="248" class="boxtext">Tx Hash and</text>
  <text x="1425" y="276" class="boxtext">Story Hash Returned</text>
  <text x="1425" y="296" class="subtext">Saved with the published article</text>

  <line x1="255" y1="252" x2="285" y2="252" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>
  <line x1="485" y1="252" x2="545" y2="252" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>
  <line x1="745" y1="252" x2="805" y2="252" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>
  <line x1="1005" y1="252" x2="1065" y2="252" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>
  <line x1="1265" y1="252" x2="1325" y2="252" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>

  <rect x="475" y="368" width="650" height="126" class="box" stroke="#d4a72c"/>
  <text x="800" y="418" class="boxtext">Registry Layer</text>
  <text x="800" y="448" class="boxtext">NewsVerify.sol or ledger-backed record store</text>
  <text x="800" y="474" class="subtext">Current project supports ledger-style registration and contract-oriented deployment</text>

  <line x1="1165" y1="304" x2="970" y2="368" stroke="#ffd84d" stroke-width="4" marker-end="url(#arrowFlow)"/>

  <text x="800" y="562" class="section" fill="#31d0aa" text-anchor="middle">VERIFY FLOW (Reader checks integrity)</text>

  <rect x="70" y="606" width="210" height="108" class="box" stroke="#7c6dff"/>
  <text x="175" y="660" class="boxtext">Open Verify Page</text>
  <text x="175" y="688" class="subtext">Select article or paste stored hash</text>

  <rect x="330" y="606" width="220" height="108" class="box" stroke="#54a8ff"/>
  <text x="440" y="650" class="boxtext">Enter Story Hash</text>
  <text x="440" y="678" class="boxtext">and Optional Tx Hash</text>

  <rect x="600" y="606" width="220" height="108" class="box" stroke="#9e7bff"/>
  <text x="710" y="660" class="boxtext">Verification Request</text>
  <text x="710" y="688" class="subtext">Sent to backend blockchain service</text>

  <rect x="870" y="606" width="220" height="108" class="box" stroke="#ffd84d"/>
  <text x="980" y="660" class="boxtext">Ledger Lookup</text>
  <text x="980" y="688" class="subtext">Match story hash and tx reference</text>

  <rect x="1140" y="606" width="220" height="108" class="box" stroke="#31d0aa"/>
  <text x="1250" y="660" class="boxtext">Record Found?</text>
  <text x="1250" y="688" class="subtext">Verified or no-match status produced</text>

  <rect x="1410" y="606" width="140" height="108" class="box" stroke="#31d0aa"/>
  <text x="1480" y="647" class="boxtext">Result</text>
  <text x="1480" y="675" class="boxtext">Shown</text>
  <text x="1480" y="700" class="subtext">Verified / Not Found</text>

  <line x1="280" y1="660" x2="330" y2="660" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>
  <line x1="550" y1="660" x2="600" y2="660" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>
  <line x1="820" y1="660" x2="870" y2="660" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>
  <line x1="1090" y1="660" x2="1140" y2="660" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>
  <line x1="1360" y1="660" x2="1410" y2="660" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>

  <line x1="980" y1="606" x2="880" y2="494" stroke="#31d0aa" stroke-width="4" marker-end="url(#arrowVerify)"/>

  <text x="800" y="844" class="note">Patent use note: this figure may be labeled as a blockchain embodiment or as a ledger-backed verification embodiment.</text>
</svg>
