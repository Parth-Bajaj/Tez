<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #f5f7fb; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #9fb0c5; font: 400 16px Arial, sans-serif; }
      .layer { fill: #8192a7; font: 700 18px Arial, sans-serif; letter-spacing: 1px; }
      .box { fill: #161b22; stroke-width: 3; rx: 20; ry: 20; }
      .boxtext { fill: #f5f7fb; font: 700 21px Arial, sans-serif; text-anchor: middle; }
      .subtext { fill: #9fb0c5; font: 400 14px Arial, sans-serif; text-anchor: middle; }
      .legend { fill: #0f1721; stroke-width: 2; rx: 10; ry: 10; }
      .legendtext { fill: #dbe5f1; font: 600 16px Arial, sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#54a8ff"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#31d0aa"/>
    </marker>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffd84d"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9e7bff"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="980"/>

  <text x="800" y="52" class="title" text-anchor="middle">Tez System Architecture</text>
  <text x="800" y="82" class="subtitle" text-anchor="middle">AI-assisted news credibility assessment with ledger-backed verification</text>

  <text x="58" y="220" class="layer" transform="rotate(-90 58 220)">PRESENTATION LAYER</text>
  <text x="58" y="520" class="layer" transform="rotate(-90 58 520)">BACKEND LAYER</text>
  <text x="58" y="790" class="layer" transform="rotate(-90 58 790)">DATA AND MODEL LAYER</text>

  <rect x="120" y="130" width="210" height="118" class="box" stroke="#7c6dff"/>
  <text x="225" y="188" class="boxtext">React Frontend</text>
  <text x="225" y="216" class="subtext">Vite-based client UI</text>

  <rect x="370" y="130" width="210" height="118" class="box" stroke="#7c6dff"/>
  <text x="475" y="188" class="boxtext">News Feed</text>
  <text x="475" y="216" class="subtext">Short-form article browsing</text>

  <rect x="620" y="130" width="210" height="118" class="box" stroke="#7c6dff"/>
  <text x="725" y="188" class="boxtext">Verify Page</text>
  <text x="725" y="216" class="subtext">Story hash and tx-hash verification</text>

  <rect x="870" y="130" width="210" height="118" class="box" stroke="#7c6dff"/>
  <text x="975" y="188" class="boxtext">Admin Panel</text>
  <text x="975" y="216" class="subtext">Upload, publish, and review flows</text>

  <rect x="1120" y="130" width="210" height="118" class="box" stroke="#7c6dff"/>
  <text x="1225" y="188" class="boxtext">Auth Pages</text>
  <text x="1225" y="216" class="subtext">Login and signup UI</text>

  <rect x="520" y="316" width="560" height="126" class="box" stroke="#54a8ff"/>
  <text x="800" y="374" class="boxtext">FastAPI REST API</text>
  <text x="800" y="404" class="boxtext">/api/*</text>
  <text x="800" y="428" class="subtext">Routing, orchestration, request validation, and service coordination</text>

  <rect x="120" y="514" width="220" height="118" class="box" stroke="#54a8ff"/>
  <text x="230" y="572" class="boxtext">Auth Service</text>
  <text x="230" y="600" class="subtext">User login and access control</text>

  <rect x="390" y="514" width="220" height="118" class="box" stroke="#54a8ff"/>
  <text x="500" y="572" class="boxtext">News Service</text>
  <text x="500" y="600" class="subtext">Create, summarize, and publish articles</text>

  <rect x="660" y="514" width="220" height="118" class="box" stroke="#9e7bff"/>
  <text x="770" y="572" class="boxtext">Prediction Service</text>
  <text x="770" y="600" class="subtext">Credibility label, confidence, and score</text>

  <rect x="930" y="514" width="220" height="118" class="box" stroke="#ffd84d"/>
  <text x="1040" y="572" class="boxtext">Blockchain Service</text>
  <text x="1040" y="600" class="subtext">Story hash storage and verification</text>

  <rect x="1200" y="514" width="220" height="118" class="box" stroke="#ff9b45"/>
  <text x="1310" y="572" class="boxtext">Report Service</text>
  <text x="1310" y="600" class="subtext">Flag review and moderation actions</text>

  <rect x="140" y="734" width="290" height="118" class="box" stroke="#31d0aa"/>
  <text x="285" y="792" class="boxtext">In-Memory Data Store</text>
  <text x="285" y="820" class="subtext">Users, news items, reports, bookmarks</text>

  <rect x="525" y="734" width="290" height="118" class="box" stroke="#9e7bff"/>
  <text x="670" y="792" class="boxtext">ML Model Artifacts</text>
  <text x="670" y="820" class="subtext">TF-IDF pipeline and classifier assets</text>

  <rect x="910" y="734" width="290" height="118" class="box" stroke="#ffd84d"/>
  <text x="1055" y="792" class="boxtext">Ledger Layer</text>
  <text x="1055" y="820" class="subtext">Story-hash registry and NewsVerify.sol embodiment</text>

  <line x1="225" y1="248" x2="650" y2="316" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="475" y1="248" x2="730" y2="316" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="725" y1="248" x2="800" y2="316" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="975" y1="248" x2="870" y2="316" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="1225" y1="248" x2="950" y2="316" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>

  <line x1="610" y1="442" x2="230" y2="514" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="710" y1="442" x2="500" y2="514" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="800" y1="442" x2="770" y2="514" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="890" y1="442" x2="1040" y2="514" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="990" y1="442" x2="1310" y2="514" stroke="#54a8ff" stroke-width="3" marker-end="url(#arrowA)"/>

  <line x1="230" y1="632" x2="285" y2="734" stroke="#31d0aa" stroke-width="3" marker-end="url(#arrowB)"/>
  <line x1="500" y1="632" x2="285" y2="734" stroke="#31d0aa" stroke-width="3" marker-end="url(#arrowB)"/>
  <line x1="770" y1="632" x2="670" y2="734" stroke="#9e7bff" stroke-width="3" marker-end="url(#arrowD)"/>
  <line x1="1040" y1="632" x2="1055" y2="734" stroke="#ffd84d" stroke-width="3" marker-end="url(#arrowC)"/>
  <line x1="1310" y1="632" x2="285" y2="734" stroke="#31d0aa" stroke-width="3" marker-end="url(#arrowB)"/>

  <rect x="145" y="896" width="210" height="42" class="legend" stroke="#7c6dff"/>
  <text x="250" y="923" class="legendtext">Frontend / UI</text>
  <rect x="405" y="896" width="210" height="42" class="legend" stroke="#54a8ff"/>
  <text x="510" y="923" class="legendtext">API / Service Layer</text>
  <rect x="665" y="896" width="210" height="42" class="legend" stroke="#9e7bff"/>
  <text x="770" y="923" class="legendtext">ML / Scoring</text>
  <rect x="925" y="896" width="210" height="42" class="legend" stroke="#ffd84d"/>
  <text x="1030" y="923" class="legendtext">Ledger / Blockchain</text>
  <rect x="1185" y="896" width="210" height="42" class="legend" stroke="#31d0aa"/>
  <text x="1290" y="923" class="legendtext">Data Store</text>
</svg>
